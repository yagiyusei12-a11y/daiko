# =============================================================================
# Kagoya VPS: Node.js (Daiko Fastify) + PHP-FPM (portal-member) 同居用 Nginx 設定例
# =============================================================================
#
# 前提:
#   - ドメイン: daiko.harunoyukoto.jp
#   - Node.js アプリは 127.0.0.1:3000 等で待受（既存の upstream と合わせてください）
#   - PHP-FPM は Unix ソケットまたは 127.0.0.1:9000
#   - リポジトリの portal-member/ をサーバー上の実パスに配置
#
# 使い方:
#   1. 下記の変数（root / fastcgi_pass / upstream）を環境に合わせて書き換え
#   2. 既存 server { } ブロック内に location をマージするか、include で読み込む
#   3. nginx -t && systemctl reload nginx
#
# 注意:
#   - /portal-member 以外は従来どおり Node へプロキシ（既存設定を維持）
#   - config.php・database/ への直接アクセスは拒否
# =============================================================================

