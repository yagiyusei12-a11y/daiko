<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>運転代行ポータル｜一時休止中</title>
    <meta name="description" content="運転代行ポータルは現在一時休止しています。" />
    <style>
      :root {
        --bg: #020617;
        --panel: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --brand: #10b981;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
        background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 55%);
        color: var(--text);
      }
      main {
        width: min(32rem, 100%);
        border: 1px solid #1e293b;
        border-radius: 1.25rem;
        background: rgba(15, 23, 42, 0.9);
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.4;
      }
      p {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.7;
      }
      .actions {
        margin-top: 1.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        font-weight: 700;
        text-decoration: none;
      }
      .primary {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
      }
      .secondary {
        border: 1px solid #334155;
        color: var(--text);
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main>
      <p style="margin:0;color:var(--brand);font-size:0.75rem;font-weight:700;letter-spacing:0.06em;">運転代行ポータル</p>
      <h1>現在、一時休止しています</h1>
      <p>
        公開一覧ポータルはいったん休止中です。<br />
        運転代行向け業務管理システム Daiko は引き続きご利用いただけます。
      </p>
      <div class="actions">
        <a class="primary" href="/">Daiko 公式サイトへ</a>
        <a class="secondary" href="/app/login">会員ログイン</a>
      </div>
    </main>
  </body>
</html>
